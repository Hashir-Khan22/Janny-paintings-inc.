<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="60%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555" />
      <stop offset="100%" stop-color="#222" />
    </linearGradient>
  </defs>

  <!-- Industrial Rig / Crane / Derrick graphic on the left -->
  <g transform="translate(10, 8)">
    <!-- Base plate -->
    <rect x="0" y="58" width="56" height="5" fill="url(#goldGrad)" rx="1"/>
    
    <!-- Steel Tower Lattice Silo -->
    <polygon points="12,58 20,8 36,8 44,58" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cross bracings -->
    <line x1="14" y1="46" x2="42" y2="46" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="16" y1="34" x2="40" y2="34" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="18" y1="21" x2="38" y2="21" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Diagonal lattice -->
    <line x1="14" y1="46" x2="40" y2="34" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="42" y1="46" x2="16" y2="34" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="16" y1="34" x2="38" y2="21" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="40" y1="34" x2="18" y2="21" stroke="url(#goldGrad)" stroke-width="1.2"/>
    
    <!-- Crane Boom Jib extending top right -->
    <polygon points="26,10 52,2 50,0 24,8" fill="url(#goldGrad)"/>
    <line x1="28" y1="8" x2="52" y2="2" stroke="#FFF" stroke-width="0.8"/>
    <line x1="51" y1="2" x2="51" y2="25" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 1"/>
    <!-- Hoist hook -->
    <circle cx="51" cy="27" r="2.5" fill="url(#goldGrad)"/>
    
    <!-- Storage tank dome outline behind -->
    <path d="M 4 58 C 4 36, 16 28, 22 26" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Typography: JANNEY PAINTING, INC. -->
  <text x="76" y="42" font-family="'Oswald', 'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="url(#goldGrad)">JANNEY</text>
  
  <rect x="77" y="49" width="195" height="2" fill="url(#goldGrad)" opacity="0.8"/>
  
  <text x="77" y="65" font-family="'Oswald', 'Barlow Condensed', 'Arial Black', sans-serif" font-size="14.5" font-weight="700" letter-spacing="3.5" fill="#FFFFFF">PAINTING, INC.</text>
</svg>

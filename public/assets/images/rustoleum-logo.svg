<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- White Card Outline -->
  <rect x="10" y="8" width="300" height="144" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Red Shield Badge -->
  <path d="M 60 25 L 260 25 C 260 85 240 120 160 140 C 80 120 60 85 60 25 Z" fill="#D9251D" filter="url(#shadow)"/>
  
  <!-- Rust-Oleum Text Top Header -->
  <text x="160" y="55" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="29" font-weight="900" fill="#FFFFFF" letter-spacing="1">RUST-OLEUM</text>
  <line x1="85" y1="62" x2="235" y2="62" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Inner Stops Rust Banner -->
  <rect x="80" y="68" width="160" height="34" fill="#FFFFFF" rx="3"/>
  <text x="160" y="93" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#D9251D" letter-spacing="1">STOPS RUST!®</text>
  
  <!-- Industrial Subtitle -->
  <text x="160" y="122" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="2">INDUSTRIAL BRANDS</text>
</svg>
